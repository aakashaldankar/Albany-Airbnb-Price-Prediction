services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: albany-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./experiments:/mlflow/experiments
      - ./experiments:/home/aaic/Personal_Projects/Albany-Airbnb-Price-Prediction/experiments:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: albany-api
    ports:
      - "8000:8000"
    volumes:
      - ./experiments:/home/aaic/Personal_Projects/Albany-Airbnb-Price-Prediction/experiments
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: albany price predictor
      MODEL_ALIAS: champion
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  gradio:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    container_name: albany-gradio
    ports:
      - "7860:7860"
    environment:
      API_URL: http://api:8000/predict
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
