services:

  postgres-service:
    image: postgres:16-alpine
    container_name: postgres-service
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: 
      - "5432:5432"
    volumes: 
      - albany-postgres-data:/var/lib/postgresql/data
    networks: [addnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-service:
    image: minio/minio
    container_name: minio-service
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - albany-minio-data:/data
    networks: [addnet]
    restart: unless-stopped
    healthcheck: 
      test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio-service:
        condition: service_healthy
    networks: [addnet]
    entrypoint: >
      /bin/sh -c "
      mc alias set local ${MLFLOW_S3_ENDPOINT_URL} $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} 
      && mc mb --ignore-existing local/mlflow-artifacts &&
      echo 'Bucket mlflow-artifacts is ready'
        "
    environment: 
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

  mlflow-service:
    build: 
      context: .
      dockerfile: Dockerfile.mlflow
    image: mlflow-image
    container_name: mlflow-service
    environment: 
      BACKEND_STORE_URI: ${BACKEND_STORE_URI}
      ARTIFACTS_DESTINATION: ${ARTIFACTS_DESTINATION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
    ports:
      - "5000:5000"
    depends_on: 
      postgres-service:
        condition: service_healthy
      minio-service:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully # wait for the bucket job to succeed
    networks: [addnet]
    restart: unless-stopped
    healthcheck: 
      test: ["CMD","python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  fastapi-service:
    build: 
      context: .
      dockerfile: Dockerfile.api
    image: fastapi-image
    container_name: fastapi-service
    environment: 
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    depends_on: 
      mlflow-service:
        condition: service_healthy
    networks: [addnet]
    restart: unless-stopped
    healthcheck: 
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    
  gradio-service: 
    build: 
      context: .
      dockerfile: Dockerfile.gradio
    image: gradio-image
    container_name: gradio-service
    environment: 
      API_URL: ${API_URL}
      GRADIO_SERVER_NAME: ${GRADIO_SERVER_NAME}
    ports: 
      - "7860:7860"
    depends_on: 
      fastapi-service:
        condition: service_healthy
    networks: [addnet]
    restart: unless-stopped
    healthcheck: 
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dvc-service: 
    build: 
      context: .
      dockerfile: Dockerfile.train
    image: dvc-image
    container_name: dvc-pipeline
    environment: 
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
    depends_on:
      mlflow-service:
        condition: service_healthy
    networks: [addnet]
    profiles: ["train"]
    restart: "no"
    
networks: 
  addnet:
    driver: bridge

volumes: 
  albany-postgres-data:
  albany-minio-data:
